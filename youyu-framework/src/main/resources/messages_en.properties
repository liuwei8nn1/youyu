# Default messages (English)
message.success=Operation successful
message.error=Operation failed

# Common messages
common.not.found=Resource not found
common.invalid.param=Invalid parameter
common.server.error=Internal server error

# Sentinel messages
sentinel.flow.control=Request rate limited, please try again later
sentinel.degrade=Service degraded, please try again later
sentinel.param.flow=Hot parameter rate limited, please try again later
sentinel.system.block=System protection triggered, please try again later
sentinel.authority.denied=Access denied due to authorization rules

# Business messages
business.exception=Business exception occurred
validation.failed=Validation failed
permission.denied=Permission denied
not.logged.in=Not logged in

# Product messages
product.not.found=Product not found
product.stock.insufficient=Insufficient stock, current stock: {0}, required: {1}
product.stock.deduct.failed=Stock deduction failed due to concurrency conflict

# Order messages
order.create.failed=Order creation failed
order.not.found=Order not found
order.duplicate.submit=Please do not submit repeatedly

# Anti-shake messages
anti.shake.limit=Operation too frequent, please try again later

# Auth messages
auth.token.missing=Authentication token is missing
auth.token.invalid=Token is invalid or expired
auth.token.required=Login required
auth.permission.denied=Insufficient permissions
auth.user.disabled=Account has been disabled
auth.device.offline=Device is not logged in or has been kicked offline

# User messages
user.username.required=Username is required
user.username.size=Username length must be between {0} and {1}
user.password.required=Password is required
user.password.min.length=Password length must be at least {0} characters
user.userType.required=User type is required
