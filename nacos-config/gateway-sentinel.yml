# ========================================
# Gateway Sentinel 专用配置
# ========================================
# 说明：
# 1. Gateway 使用特殊的 gw-flow 规则类型（GatewayFlowRule）
# 2. 与普通微服务的 flow 规则（FlowRule）不同
# 3. 支持路由级别、IP级别、用户ID级别等多维度限流
# ========================================
spring:
  cloud:
    sentinel:
      scg:

      transport:
        # Sentinel Dashboard 地址
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
        # 客户端监控 API 的端口 (每个应用需要不同,建议在应用专属配置中覆盖)
        port: ${SENTINEL_CLIENT_PORT:8719}

      # 日志目录
      log:
        dir: ${user.home}/logs/csp/${spring.application.name}

      # 数据源配置 (从 Nacos 读取规则)
      datasource:
        # Gateway 流控规则 (GatewayFlowRule) - Gateway 专用
        gw-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.config.server-addr}
            data-id: ${spring.application.name}-gateway-flow-rules
            group-id: ${spring.cloud.nacos.config.group}
            rule-type: gw-flow
            data-type: json

        # 系统级限流规则 (SystemRule) - 保护整个应用
        system:
          nacos:
            server-addr: ${spring.cloud.nacos.config.server-addr}
            data-id: ${spring.application.name}-system-rules
            group-id: ${spring.cloud.nacos.config.group}
            rule-type: system
            data-type: json

        # 热点参数限流规则 (ParamFlowRule) - 用于全局IP限流等
        param-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.config.server-addr}
            data-id: ${spring.application.name}-param-flow-rules
            group-id: ${spring.cloud.nacos.config.group}
            rule-type: param-flow
            data-type: json
