# ========================================
# 公共数据库配置（Nacos）
# ========================================
# 
# 使用说明：
# 1. 此文件是 Nacos 配置中心的公共数据库配置
# 2. 所有需要数据库的微服务都可以引用此配置
# 3. Nacos 配置信息：
#    - Data ID: common-db.yaml
#    - Group: DEFAULT_GROUP
#    - Namespace: youyu-cloud
#    - 配置格式: YAML
#
# 使用方式：在 application.yml 中导入
#   spring:
#     config:
#       import:
#         - "nacos:common-db.yaml"
# ========================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:prod-db-server}:3306/youyu_db?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:prod_user}
    password: ${DB_PASSWORD:prod_secure_password}
    
    # ========================================
    # HikariCP 连接池配置
    # ========================================
    hikari:
      minimum-idle: 10              # 最小空闲连接数
      maximum-pool-size: 50         # 最大连接池大小
      connection-timeout: 30000     # 连接超时时间（毫秒）
      idle-timeout: 600000          # 空闲连接超时时间（毫秒）
      max-lifetime: 1800000         # 连接最大生命周期（毫秒）
      pool-name: HikariCP-Prod-Pool # 连接池名称
