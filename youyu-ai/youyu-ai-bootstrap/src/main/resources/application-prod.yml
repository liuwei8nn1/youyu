# ========================================
# 生产环境配置
# ========================================

# AI 提供商配置
ai:
  provider: dashscope

# Spring AI - 阿里云通义千问配置
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7

# MyBatis-Plus 配置（生产环境关闭 SQL 日志）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.youyu.ai.entity
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志配置（生产环境）
logging:
  level:
    root: WARN
    com.youyu.ai: INFO
    org.springframework.ai: WARN
