# ========================================
# 开发环境配置
# ========================================

# AI 提供商配置
ai:
  provider: dashscope  # dashscope(通义千问) 或 openai

# Spring AI - 阿里云通义千问配置
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7

# Spring AI - OpenAI 配置（备用）
# spring:
#   ai:
#     openai:
#       api-key: ${OPENAI_API_KEY:your-api-key-here}
#       chat:
#         options:
#           model: gpt-3.5-turbo
#           temperature: 0.7

# MyBatis-Plus 配置（开发环境开启 SQL 日志）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.youyu.ai.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置（开发环境详细日志）
logging:
  level:
    root: INFO
    com.youyu.ai: DEBUG
    org.springframework.ai: DEBUG
