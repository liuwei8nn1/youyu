# AI 服务提供商配置
# 支持多模型动态切换，根据场景选择不同提供商

ai:
  providers:
    # ========================================
    # 1. 硅基流动 (SiliconFlow) - OpenAI 兼容
    # 适用场景：商品描述润色、日常对话（成本低，速度快）
    # ========================================
    siliconflow:
      api-key: ${SILICONFLOW_API_KEY:your-siliconflow-api-key}
      base-url: https://api.siliconflow.cn/v1
      model: Qwen/Qwen2.5-72B-Instruct
      type: openai
    
    # ========================================
    # 2. 智谱 GLM-4 (Zhipu) - OpenAI 兼容
    # 适用场景：复杂推理、数据分析（能力强）
    # ========================================
    zhipu:
      api-key: ${ZHIPU_API_KEY:your-zhipu-api-key}
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-plus
      type: openai
    
    # ========================================
    # 3. DeepSeek - OpenAI 兼容
    # 适用场景：代码生成、技术文档（代码能力强）
    # ========================================
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      base-url: https://api.deepseek.com/v1
      model: deepseek-chat
      type: openai
    
    # ========================================
    # 4. 通义千问 (DashScope) - 阿里云
    # 适用场景：企业级应用、中文优化（官方支持）
    # 可选模型：qwen-max, qwen-plus, qwen-turbo, qwen-long
    # ========================================
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      model: qwen-max
      type: dashscope
    
    # ========================================
    # 5. Moonshot (Kimi) - OpenAI 兼容
    # 适用场景：长文本处理、文档分析（上下文窗口大）
    # ========================================
    moonshot:
      api-key: ${MOONSHOT_API_KEY:your-moonshot-api-key}
      base-url: https://api.moonshot.cn/v1
      model: moonshot-v1-8k
      type: openai
